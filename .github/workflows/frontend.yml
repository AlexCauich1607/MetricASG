name: Frontend CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend-tests:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: Frontend/metric-asg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.18.0"
          cache: "npm"
          cache-dependency-path: Frontend/metric-asg/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build application
        run: npm run build