<div class="sw-split-ly color-bg">
    <div>
        <h4 class="text-my-purple fw-bold mb-4"><span class="bg-white py-2 px-4 rounded-5 shadow-sm border"><i class="bi bi-hourglass-split"></i> Historial</span></h4>

        <p class="text-white fw-bold mt-5 mb-4"><span class="bg-my-purple py-2 px-4 rounded-5 shadow-sm border"><i class="bi bi-star-fill"></i> Puntaciones Históricas</span></p>
        <div class="row split-margin  align-items-stretch">
            <div class="col-6 col-lg-3 mb-2">
                <div class="sw-bg-blue-light sw-hover-scale rounded p-4 border shadow-sm">
                    <div class="d-flex justify-content-between align-items-stretch">
                        <p class="text-my-purple sw-fs-7 fw-bold"><i class="bi bi-globe-americas"></i> Nivel ASG</p>
                    </div>
                    <div class="d-flex justify-content-end">
                        <div class="sw-bg-sm-purple text-my-purple p-0 px-3 py-1 rounded text-center">
                            <p class=" sw-fs-7 m-0 p-0">Promedio
                            </p>
                            <p class="m-0 fs-3 p-0 fw-bold"> {{ historial?.averages?.global_score?.toFixed(1) ?? '0' }}
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-6 col-lg-3" *ngFor="let ambito of historial?.averages?.ambits">
                <app-ambit-card [title]="ambito.ambit_name" [letter]="ambito.letter!" [color]="ambito.ambit_color"
                    [subtitle]="'Promedio'" [maturity_color]="ambito.ambit_color"
                    [score]="ambito.score"></app-ambit-card>
            </div>
        </div>
        <div class="row g-1 split-margin" *ngIf="loadingChart">
            <div class="col-12 col-lg-6 ">
                <div class="border rounded bg-white p-4 m-2 shadow-sm">
                    <h5 class="text-center fw-bold mb-3 " [style.color]="blueColor">
                        <b class="text-white px-1 rounded" [style.backgroundColor]="blueColor"><i
                                class="bi bi-globe-americas"></i></b> {{global.name}}
                    </h5>
                    <app-bar-chart [data]="global.data" [scores]="global.scores" [colors]="global.colors"
                        [id]="0"></app-bar-chart>
                </div>
            </div>
            <div class="col-12 col-lg-6 " *ngFor="let ambito of data | keyvalue">
                <div class="border rounded bg-white p-4 m-2 shadow-sm">
                    <h5 class="text-center fw-bold mb-3 " [style.color]="getColor(ambito.key)">
                        <b class="text-white px-2 rounded"
                            [style.backgroundColor]="getColor(ambito.key)">{{getLetter(ambito.key)}}</b>
                        {{ambito.value.name}}
                    </h5>
                    <app-bar-chart [data]="data.get(ambito.key)?.data??[]" [scores]="data.get(ambito.key)?.scores??[]"
                        [colors]="data.get(ambito.key)?.colors??[]" [id]="ambito.key"></app-bar-chart>
                </div>
            </div>
        </div>

    </div>
</div>
