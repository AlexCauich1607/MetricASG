
<div class="analysis-shell">

  <div class="container analysis-navigation">

    <nav
      class="analysis-navigation__tabs"
      aria-label="Secciones de Análisis ASG">

      <a
        class="analysis-navigation__link"
        routerLink="/user/analysis/results"
        routerLinkActive="active"
        ariaCurrentWhenActive="page">

        <i
          class="bi bi-bar-chart-line"
          aria-hidden="true">
        </i>

        <span>Resultados</span>

      </a>

      <a
        class="analysis-navigation__link"
        routerLink="/user/analysis/evolution"
        routerLinkActive="active"
        ariaCurrentWhenActive="location">

        <i
          class="bi bi-graph-up-arrow"
          aria-hidden="true">
        </i>

        <span>Evolución</span>

      </a>

      <a
        class="analysis-navigation__link"
        routerLink="/user/analysis/benchmark"
        routerLinkActive="active"
        ariaCurrentWhenActive="page">

        <i
          class="bi bi-bar-chart-steps"
          aria-hidden="true">
        </i>

        <span>Benchmarking</span>

      </a>

    </nav>

  </div>

  <router-outlet></router-outlet>

</div>
