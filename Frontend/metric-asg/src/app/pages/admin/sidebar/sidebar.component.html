<button class="btn btn-outline-none text-my-purple d-md-none mb-0 fs-2 ms-2" (click)="toggleSidebar()">
  <i class="bi bi-list"></i>
</button>

<div class="sidebar-overlay" *ngIf="isOpen" (click)="toggleSidebar()">
</div>

<nav class="admin-sidebar bg-white text-purple p-3 d-flex flex-column" [class.open]="isOpen">

  <div class="mb-4 mt-4 sw-h-center text-center">
    <div class=" d-flex  align-items-center sw-all-center">
      <img src="assets/logo.png" alt="MetricASG" height="40" class="me-2">
      <span class="font-logo text-my-purple fs-4">MetricASG</span>
    </div>
    <small class="text-my-gray">Admin Panel</small>
  </div>

  <ul class="nav flex-column gap-2">

    <li>
      <a class="nav-link text-purple" routerLink="/admin/dashboard" routerLinkActive="active" (click)="closeOnMobile()">
        <i class="bi bi-speedometer2 me-2"></i>
        Dashboard
      </a>
    </li>

    <li>
      <a class="nav-link text-purple" routerLink="/admin/users" routerLinkActive="active" (click)="closeOnMobile()">
        <i class="bi bi-people me-2"></i>
        Usuarios
      </a>
    </li>

    <li>
      <a class="nav-link text-purple" routerLink="/admin/ambits" routerLinkActive="active" (click)="closeOnMobile()">
        <i class="bi bi-diagram-3 me-2"></i>
        Ámbitos
      </a>
    </li>

    <li>
      <a class="nav-link text-purple" routerLink="/admin/maturity-levels" routerLinkActive="active"
        (click)="closeOnMobile()">
        <i class="bi bi-bar-chart me-2"></i>
        Nivel de Madurez
      </a>
    </li>

    <li>
      <a class="nav-link text-purple" routerLink="/admin/company" routerLinkActive="active" (click)="closeOnMobile()">
        <i class="bi bi-building me-2"></i>
        Info. Empresas
      </a>
    </li>

  </ul>
  <div class="sw-end">
    <button class="btn-my-purple  sw-cursor-pointer sw-fs-6 px-4 mb-3 shadow-sm" (click)="close()"> <i
        class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión</button>
  </div>
</nav>
