<button #menuTrigger type="button" class="btn btn-outline-none text-my-purple d-md-none mb-0 fs-2 ms-2"
  (click)="toggleSidebar()" [attr.aria-expanded]="isOpen" aria-controls="admin-sidebar-navigation"
  [attr.aria-label]="isOpen ? 'Cerrar menú administrativo' : 'Abrir menú administrativo'">
  <i class="bi bi-list" aria-hidden="true"></i>
</button>

@if (isOpen) {
<div class="sidebar-overlay" (click)="toggleSidebar()">
</div>
}

<nav #sidebarNav id="admin-sidebar-navigation" class="admin-sidebar bg-white text-purple p-3 d-flex flex-column"
  [class.open]="isOpen" [attr.inert]="isMobile && !isOpen ? '' : null" aria-label="Navegación administrativa">
  <div class="d-flex justify-content-end d-md-none">
    <button #closeButton type="button" class="btn admin-sidebar-close" (click)="toggleSidebar()"
      aria-label="Cerrar menú administrativo">
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
  </div>
  <div class="mb-4 mt-4 sw-h-center text-center">
    <div class=" d-flex  align-items-center sw-all-center">
      <img src="assets/logo.png" alt="MetricASG" height="40" class="me-2">
      <span class="font-logo text-my-purple fs-4">MetricASG</span>
    </div>
    <small class="text-my-gray">Admin Panel</small>
  </div>

  <ul class="nav flex-column gap-2">

    <li>
      <a class="nav-link text-purple" routerLink="/admin/dashboard" routerLinkActive="active" (click)="closeOnMobile()">
        <i class="bi bi-speedometer2 me-2"></i>
        Dashboard
      </a>
    </li>

    <li>
      <a class="nav-link text-purple" routerLink="/admin/users" routerLinkActive="active" (click)="closeOnMobile()">
        <i class="bi bi-people me-2"></i>
        Usuarios
      </a>
    </li>

    <li>
      <a class="nav-link text-purple" routerLink="/admin/ambits" routerLinkActive="active" (click)="closeOnMobile()">
        <i class="bi bi-diagram-3 me-2"></i>
        Ámbitos
      </a>
    </li>

    <li>
      <a class="nav-link text-purple" routerLink="/admin/maturity-levels" routerLinkActive="active"
        (click)="closeOnMobile()">
        <i class="bi bi-bar-chart me-2"></i>
        Nivel de Madurez
      </a>
    </li>

    <li>
      <a class="nav-link text-purple" routerLink="/admin/company" routerLinkActive="active" (click)="closeOnMobile()">
        <i class="bi bi-building me-2"></i>
        Info. Empresas
      </a>
    </li>

  </ul>
  <div class="sw-end">
    <button class="btn-my-purple  sw-cursor-pointer sw-fs-6 px-4 mb-3 shadow-sm" (click)="close()"> <i
        class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión</button>
  </div>
</nav>
