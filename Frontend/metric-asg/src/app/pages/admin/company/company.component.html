<div class="container-fluid">
    <div class="d-flex align-items-center color-bg justify-content-between py-2 px-5 pt-5 pb-3 sw-sticky">
        <h4 class="text-my-purple fw-bold fs-4"><span class="bg-white py-2 px-4 rounded-5 shadow-sm border"><i
                    class="bi bi-building-fill"></i> Información de Empresas</span></h4>
        <app-profile-photo></app-profile-photo>
    </div>
    <div class="px-5 pb-4">
        <div class="row g-3 mt-1 sw-scroll-v mb-3 align-items-stretch">
            <div class="col-lg-6">
                <div class="card sw-card sw-bg-blue-light m-0 p-0 shadow-sm h-100">
                    <div class="card-body p-0 d-flex flex-column">

                        <div class="bg-white shadow-sm p-1 px-4">
                            <div class="d-flex align-items-center justify-content-between">
                                <p class="mt-3 fw-bold text-my-purple sw-fs-6">
                                    <i class="bi bi-gear me-2"></i> Sectores
                                </p>
                                <div class="btn-my-purple sw-cursor-pointer sw-fs-7" (click)="openSectorCreateModal()">
                                    + Añadir
                                </div>
                            </div>
                        </div>

                        <div class="text-muted sw-scroll-h sw-v-100 d-flex px-4 flex-column align-items-stretch">
                            <div class="card sw-cursor-pointer rounded-4 w-100 my-2 sw-v-center border-0 shadow-sm"
                                *ngFor="let sector of sectores; let i = index">
                                <div class="card-body  text-my-purple d-flex align-items-center justify-content-between"
                                    (click)="openSectorEditModal(sector.id)">
                                    <p class="fw-bold m-0 sw-fs-7 one-line-ellipsis">
                                        {{ sector.name }}
                                    </p>
                                    <p
                                        class="fw-bold ms-3 m-0 sw-bg-blue-light px-3 text-my-purple py-1 rounded-5 sw-fs-6 ">
                                        ></p>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card sw-card sw-bg-blue-light m-0 p-0 shadow-sm h-100">
                    <div class="card-body p-0 d-flex flex-column">

                        <div class="bg-white shadow-sm p-1 px-4">
                            <div class="d-flex align-items-center justify-content-between">
                                <p class="mt-3 fw-bold text-my-purple sw-fs-6">
                                    <i class="bi bi-people me-2"></i> Tamaño
                                </p>
                                <div class="btn-my-purple sw-cursor-pointer sw-fs-7" (click)="openSizeCreateModal()">
                                    + Añadir
                                </div>
                            </div>
                        </div>

                        <div class="text-muted sw-scroll-h sw-v-100 d-flex px-4 flex-column align-items-stretch">
                            <div class="card sw-cursor-pointer rounded-4 w-100 my-2 sw-v-center border-0 shadow-sm"
                                *ngFor="let size of sizes; let i = index">
                                <div class="card-body  text-my-purple d-flex align-items-center justify-content-between"
                                    (click)="openSizeEditModal(size.id)">
                                    <p class="fw-bold m-0 sw-fs-7 one-line-ellipsis">
                                        {{ size.name }}
                                    </p>
                                    <p
                                        class="fw-bold ms-3 m-0 sw-bg-blue-light px-3 text-my-purple py-1 rounded-5 sw-fs-6 ">
                                        ></p>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
