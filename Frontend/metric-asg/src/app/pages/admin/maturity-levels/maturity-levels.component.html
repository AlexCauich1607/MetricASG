<div class="container-fluid">
    <div class="d-flex align-items-center color-bg justify-content-between py-2 px-5 pt-5 pb-3 sw-sticky">
        <h4 class="text-my-purple fw-bold fs-4"><span class="bg-white py-2 px-4 rounded-5 shadow-sm border"><i
                    class="bi bi-bar-chart-fill"></i> Niveles de Madurez</span></h4>
        <app-profile-photo></app-profile-photo>
    </div>
    <div class="px-5 pb-5">
        <div class="row g-3 sw-scroll-v mb-3 mt-1 align-items-stretch">
            <div class="col-2">
                <button class="btn btn-my-purple sw-cursor-pointer sw-btn-lg sw-fs-7 mb-3" (click)="openCreateModal()">
                    + Añadir
                </button>
                <div class="ambits-container-column ">
                    <div class="card sw-cursor-pointer ambit-card border-0 shadow-sm border borde-izq "
                        [style.backgroundColor]="n.color" [ngClass]="{ 'borde-izq': nivel?.id === n.id }"
                        *ngFor="let n of niveles">
                        <div class="card-body text-white sw-all-center " (click)="selectLevel(n.id!)">
                            <small class="fw-bold">{{ n.name }}</small>
                        </div>
                    </div>

                </div>
            </div>

            <div class="col-10">
                <div class="card sw-card sw-bg-blue-light m-0 p-0 shadow-sm h-100">
                    <div class="card-body p-0 d-flex flex-column">

                        <div class="bg-white shadow-sm p-1 px-4">
                            <div class="d-flex align-items-center justify-content-between">
                                <p class="mt-3 fw-bold text-my-purple sw-fs-6" [style.color]="nivel!.color">
                                    <i class="bi bi-bar-chart-fill me-2"></i>{{nivel!.name}}
                                </p>
                            </div>

                        </div>
                        <div [formGroup]="form">
                            <div class="text-muted  sw-v-100 d-flex px-4 p-3 flex-column align-items-stretch">
                                <div class="sw-row gap-4">
                                    <div class="sw-h-100">
                                        <p class="fw-bold text-my-purple sw-fs-7 mb-2"><i
                                                class="bi bi-card-text me-1"></i>
                                            Nombre</p>
                                        <input class="mt-0 sw-h-100 sw-fs-7 text-my-purple form-control" type="text"
                                            formControlName="name" placeholder="Ingrese el nombre del nivel" required>
                                        <div
                                            *ngIf="getValue('name')!.invalid && (getValue('name')!.dirty || getValue('name')!.touched)">
                                            <p class="sw-text-error">*El nombre debe tener minimo 3 caracteres</p>
                                        </div>
                                    </div>
                                    <div class="sw-h-20">
                                        <label class="form-label sw-fs-7 fw-bold text-my-purple"><i
                                                class="bi bi-palette me-1"></i> Color</label>
                                        <div class="sw-row">
                                            <input type="color" class="form-control sw-fs-7 sw-input-color"
                                                formControlName="color" />
                                            <p class="sw-fs-7 text-my-gray mt-1 ms-2"> {{edit_color}}</p>
                                        </div>
                                    </div>


                                </div>

                                <div class="sw-row gap-4 mt-4">
                                    <div class="sw-h-50">
                                        <p class="fw-bold text-my-purple sw-fs-7 mb-2"><i
                                                class="bi bi-hash me-1"></i>Valor
                                        </p>
                                        <input class="mt-0 sw-h-100 sw-fs-7 text-my-purple form-control" type="number"
                                            formControlName="value" required>
                                        <div
                                            *ngIf="getValue('value')!.invalid && (getValue('value')!.dirty || getValue('value')!.touched) ">
                                            <p class="sw-text-error">*Este campo no puede estar vacio</p>
                                        </div>
                                    </div>
                                    <div class="sw-h-50">
                                        <p class="fw-bold text-my-purple sw-fs-7 mb-2"><i
                                                class="bi bi-dash-circle me-1"></i> Valor Minimo</p>
                                        <input class="mt-0 sw-h-100 sw-fs-7 text-my-purple form-control" type="number"
                                            formControlName="min_score">
                                        <div
                                            *ngIf="getValue('min_score')!.invalid && (getValue('min_score')!.dirty || getValue('min_score')!.touched) ">
                                            <p class="sw-text-error">*Este campo no puede estar vacio</p>
                                        </div>
                                    </div>
                                    <div class="sw-h-50 ">
                                        <p class="fw-bold text-my-purple sw-fs-7 mb-2"><i
                                                class="bi bi-plus-circle me-1"></i> Valor Maximo </p>
                                        <input class="mt-0 sw-h-100 sw-fs-7 text-my-purple form-control" type="number"
                                            formControlName="max_score">
                                        <div
                                            *ngIf="getValue('max_score')!.invalid && (getValue('max_score')!.dirty || getValue('max_score')!.touched) ">
                                            <p class="sw-text-error">*Este campo no puede estar vacio</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex align-items-center justify-content-between mx-4">
                                <button class="sw-btn-red-secondary sw-h-20 sw-cursor-pointer sw-fs-7 mb-3"
                                    (click)="deleteLevel()" *ngIf="nivel?.is_removable">
                                    <i class="bi bi-trash"></i> Eliminar
                                </button>
                                <div *ngIf="nivel?.is_removable==false"></div>
                                <button class="btn-my-purple sw-cursor-pointer sw-h-20 sw-fs-7 mb-3" type="submit"
                                    [disabled]="form.invalid" (click)="updateLevel()">
                                    <i class="bi bi-check-lg"></i> Guardar
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
