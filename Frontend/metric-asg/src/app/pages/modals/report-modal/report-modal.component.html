<div class="bg-white sw-modal">
    <div class="p-4  ">
        <div class="modal-content p-5">
            <app-pdf-template [name]="data.name" [results]="data.results"></app-pdf-template>
        </div>
        <div class="modal-footer d-flex justify-content-center gap-2 ">
            <button class="sw-btn-white-purple text-my-purple bg-white sw-cursor-pointer sw-fs-7 mt-4"
                (click)="close()">
                <i class="bi bi-x-lg"></i> Cerrar
            </button>
        </div>
    </div>
</div>
