<a class="nav-link  d-flex align-items-center m-0 p-0"  role="button" data-bs-toggle="dropdown" (click)="openConfiguration()">
  @if (!photo || photo.length <= 0) {
    <div class="bg-my-purple sw-all-center sw-circle" style="height: 40px; width: 40px;"><i
    class="bi bi-person-fill text-white fs-5"></i></div>
  }
  @if (photo && photo.length > 0) {
    <img class="sw-circle sw-all-center" style="height: 40px;width: 40px;" [src]="getImage()"
      alt="Foto de usuario" />
  }
</a>
