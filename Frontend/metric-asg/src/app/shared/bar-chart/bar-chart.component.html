
<div
  class="chart-container"
  [class.chart-container--dashboard]="variant === 'dashboard'"
  [class.chart-container--results]="variant === 'results'">

  <canvas
    #chartCanvas
    [id]="'MyChart' + id"
    [attr.role]="variant !== 'default' ? 'img' : null"
    [attr.aria-label]="variant !== 'default'
      ? 'Gráfica de puntuaciones por ámbito ASG. Los valores se muestran en las tarjetas anteriores.'
      : null">
  </canvas>

</div>
