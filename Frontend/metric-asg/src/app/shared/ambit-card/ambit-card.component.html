<div class="m-0 p-0 shadow-sm">
    <div class="sw-bg-blue-light shadow-sm sw-hover-scale rounded  p-4" [style.backgroundColor]="color">
        <div class="d-flex justify-content-between align-items-stretch">
            <p class="text-white sw-fs-7 fw-bold"><b class="bg-white me-1 px-1 rounded"
                    [style.color]="color">{{letter}}</b> {{title}}
            </p>
            <p class="m-0 p-0 sw-fs-7"><b class="m-0 px-1 py-0 sw-fs-7 rounded-5"
                    [style.backgroundColor]="maturity_color" [style.color]="maturity_color">g</b></p>

        </div>

        <div class="d-flex justify-content-end">
            <div class="sw-bg-sm-white text-white p-0 px-3 py-1 rounded text-center">
                <p class=" sw-fs-7 m-0 p-0">{{subtitle}}
                </p>
                <p class="m-0 fs-3 p-0 fw-bold">{{score.toFixed(1)}}</p>

            </div>

        </div>

    </div>
</div>
